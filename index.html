<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCPL Treasury Control Tower</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --brand:#ffe600; --brand-ink:#16161d;
  --nav:#17171e; --nav-2:#202029; --nav-ink:#c9c8c0; --nav-muted:#7f7e78;
  --font:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --page:#111117; --surface:#1b1b23; --surface-2:#23232d; --surface-3:#2d2d39;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.15);
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e88; --grid:#2a2a33;
  --accent-text:#ffe600; --hover:rgba(255,255,255,.04);
  --good-t:#43c443; --warn-t:#fab219; --serious-t:#ef9470; --crit-t:#f07a7a; --info-t:#86b6ef;
  --good-bg:rgba(12,163,12,.16); --warn-bg:rgba(250,178,25,.15); --serious-bg:rgba(236,131,90,.16); --crit-bg:rgba(208,59,59,.20); --info-bg:rgba(57,135,229,.16);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --neutral:#7d7c76;
  --heat:57,135,229;
}
html[data-theme="light"]{
  color-scheme:light;
  --page:#f2f2ee; --surface:#ffffff; --surface-2:#f6f6f3; --surface-3:#ebebe6;
  --border:rgba(11,11,11,.09); --border-2:rgba(11,11,11,.17);
  --ink:#16161d; --ink-2:#52514e; --ink-3:#74736d; --grid:#e6e5df;
  --accent-text:#6f5c00; --hover:rgba(0,0,0,.03);
  --good-t:#006300; --warn-t:#7d4f00; --serious-t:#a3441c; --crit-t:#b3261e; --info-t:#1c5cab;
  --good-bg:rgba(12,163,12,.11); --warn-bg:rgba(250,178,25,.20); --serious-bg:rgba(236,131,90,.18); --crit-bg:rgba(208,59,59,.12); --info-bg:rgba(42,120,214,.11);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6; --neutral:#a3a29b;
  --heat:42,120,214;
}
*{box-sizing:border-box}
html,body{background:var(--page);}
body{color:var(--ink); font-family:var(--font); font-size:14px; margin:0; -webkit-font-smoothing:antialiased;}
a{color:inherit}
[v-cloak]{display:none}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.small2{font-size:12px}
.fw6{font-weight:600} .fw7{font-weight:700}

/* ---------- shell ---------- */
.topband{height:4px; background:var(--brand); position:sticky; top:0; z-index:40}
.shell{display:flex; min-height:calc(100vh - 4px)}
.side{width:244px; flex-shrink:0; background:var(--nav); color:var(--nav-ink); position:sticky; top:4px; height:calc(100vh - 4px); overflow-y:auto; display:flex; flex-direction:column; z-index:30}
.brand{display:flex; gap:10px; align-items:center; padding:18px 16px 14px}
.logo{width:38px; height:38px; background:var(--brand); color:var(--brand-ink); font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; clip-path:polygon(0 18%,100% 0,100% 100%,0 100%); letter-spacing:.02em}
.b1{font-weight:700; color:#f4f3ef; font-size:14px; line-height:1.15}
.b2{font-size:11px; color:var(--nav-muted)}
.nav-sec{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--nav-muted); padding:14px 18px 6px; font-weight:700}
.nav-it{display:flex; align-items:center; gap:10px; padding:8px 16px 8px 15px; margin:1px 8px; border-radius:7px; color:var(--nav-ink); text-decoration:none; cursor:pointer; border:none; background:none; width:calc(100% - 16px); text-align:left; font-size:13.5px; border-left:3px solid transparent}
.nav-it i{font-size:15px; width:18px; text-align:center; opacity:.9}
.nav-it:hover{background:var(--nav-2); color:#fff}
.nav-it.active{background:var(--nav-2); color:#fff; border-left-color:var(--brand)}
.nav-it.active i{color:var(--brand)}
.nav-it.locked{opacity:.38; cursor:not-allowed}
.nav-it .q{margin-left:auto; font-size:10px; color:var(--nav-muted); font-weight:600}
.side-foot{margin-top:auto; padding:14px 16px; font-size:11px; color:var(--nav-muted); border-top:1px solid rgba(255,255,255,.06); line-height:1.45}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{display:flex; align-items:center; gap:10px; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:4px; z-index:25; flex-wrap:wrap}
.role-pick{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-2); border-radius:8px; padding:3px 4px 3px 10px}
.role-pick label{font-size:11px; color:var(--ink-3); white-space:nowrap}
.role-pick select{background:transparent; color:var(--ink); border:none; font-weight:600; font-size:13px; padding:4px 4px; outline:none; max-width:210px}
.role-pick select option{background:var(--surface); color:var(--ink)}
.ask{flex:1; min-width:180px; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-2); border-radius:8px; padding:6px 10px}
.ask i{color:var(--accent-text)}
.ask input{flex:1; background:transparent; border:none; outline:none; color:var(--ink); font-size:13px; min-width:0}
.ask input::placeholder{color:var(--ink-3)}
.fresh{display:flex; flex-direction:column; font-size:11px; color:var(--ink-3); line-height:1.3; margin-left:auto}
.fresh b{color:var(--ink-2); font-weight:600}
.clock{display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums}
.live-dot{width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 rgba(12,163,12,.6); animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.55)} 70%{box-shadow:0 0 0 7px rgba(12,163,12,0)} 100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
@media (prefers-reduced-motion: reduce){ .live-dot{animation:none} }
.btn-icon{position:relative; width:36px; height:36px; border-radius:8px; border:1px solid var(--border-2); background:var(--surface-2); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0}
.btn-icon:hover{border-color:var(--ink-3)}
.badge-n{position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px; background:var(--crit); color:#fff; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 5px}
.content{padding:20px 22px 30px; flex:1}
.foot{padding:12px 22px 18px; font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--border)}
.nav-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:29}
@media (max-width: 991.98px){
  .side{position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); transition:transform .2s ease}
  .side.open{transform:none}
  .content{padding:16px 14px 26px}
  .topbar{padding:8px 12px}
}

/* ---------- view header ---------- */
.vh{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px 16px; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--brand)}
.vh h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em}
.vh-sub{color:var(--ink-2); font-style:italic; font-size:13.5px; margin-top:3px}
.vh-r{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.qchip{background:var(--brand); color:var(--brand-ink); font-weight:700; font-size:11.5px; padding:4px 12px; border-radius:5px; white-space:nowrap}
.scope-pill{font-size:12px; color:var(--ink-2); border:1px solid var(--border-2); border-radius:999px; padding:3px 10px; white-space:nowrap}

/* ---------- cards ---------- */
.cardx{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; height:100%}
.ch{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.ct{font-weight:650; font-size:14.5px}
.cs{color:var(--ink-3); font-size:12px; margin-top:2px}
.stat{cursor:default}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--border-2)}
.stat .lbl{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px}
.stat .val{font-size:25px; font-weight:650; line-height:1.15; margin-top:6px; letter-spacing:-.01em}
.stat .val small{font-size:13px; font-weight:500; color:var(--ink-2); margin-left:3px}
.stat .sub{font-size:12px; color:var(--ink-2); margin-top:5px}
.hl{border-left:3px solid var(--brand)}
.dark-card{background:#202029; color:#f0efec; border-color:transparent}
html[data-theme="light"] .dark-card{background:#2b2b35}
.dark-card .cs{color:#a9a8a0}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; line-height:1.6}
.chip.good{background:var(--good-bg); color:var(--good-t)}
.chip.warn{background:var(--warn-bg); color:var(--warn-t)}
.chip.serious{background:var(--serious-bg); color:var(--serious-t)}
.chip.crit{background:var(--crit-bg); color:var(--crit-t)}
.chip.info{background:var(--info-bg); color:var(--info-t)}
.chip.neutral{background:var(--surface-3); color:var(--ink-2)}
.tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:4px; background:var(--surface-3); color:var(--ink-2); white-space:nowrap}
.tag.y{background:var(--brand); color:var(--brand-ink); font-weight:600}
.dot{display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:middle}
.lkey{display:inline-block; width:14px; height:2px; vertical-align:middle; border-radius:1px}

/* ---------- tables ---------- */
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{color:var(--ink-3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border-2); padding:8px 8px; text-align:left; white-space:nowrap; background:transparent}
.tbl td{padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:middle; font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--hover)}
.tbl .r{text-align:right; white-space:nowrap}
.tbl .nw{white-space:nowrap}
.tbl .c{text-align:center}
.tbl tfoot td{font-weight:650; border-top:1px solid var(--border-2); border-bottom:none}
.tscroll{overflow-x:auto}

/* ---------- controls ---------- */
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border-2); border-radius:8px; padding:2px}
.seg button{border:none; background:transparent; color:var(--ink-2); font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:6px; cursor:pointer; white-space:nowrap}
.seg button.on{background:var(--brand); color:var(--brand-ink)}
.btnx{border:1px solid var(--border-2); background:var(--surface-2); color:var(--ink); font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer; white-space:nowrap}
.btnx:hover{border-color:var(--ink-3)}
.btnx.brand{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
.btnx.sm{padding:3px 9px; font-size:12px}
.btnx:disabled{opacity:.45; cursor:not-allowed}
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.filters label{font-size:12px; color:var(--ink-3); margin-right:2px}
.sw{display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:13px}
.sw input{display:none}
.sw .tr{width:34px; height:19px; border-radius:10px; background:var(--surface-3); border:1px solid var(--border-2); position:relative; transition:background .15s}
.sw .tr::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--ink-3); transition:transform .15s, background .15s}
.sw input:checked + .tr{background:var(--brand); border-color:var(--brand)}
.sw input:checked + .tr::after{transform:translateX(15px); background:var(--brand-ink)}
input[type=range]{accent-color:#c9b200; width:100%}
select.sel{background:var(--surface-2); color:var(--ink); border:1px solid var(--border-2); border-radius:7px; padding:5px 8px; font-size:13px}
input.num{background:var(--surface-2); color:var(--ink); border:1px solid var(--border-2); border-radius:7px; padding:4px 8px; font-size:13px; width:90px}

/* ---------- bars ---------- */
.ubar{position:relative; height:8px; background:var(--surface-3); border-radius:4px; min-width:90px}
.ubar .f{position:absolute; left:0; top:0; bottom:0; border-radius:4px}
.ubar .m{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-2)}
.hbar{display:flex; align-items:center; gap:8px}
.hbar .t{flex:1; height:8px; background:var(--surface-3); border-radius:4px; position:relative; overflow:hidden}
.hbar .t .f{position:absolute; left:0; top:0; bottom:0; border-radius:4px}
.stack{display:flex; gap:2px; height:22px; border-radius:5px; overflow:hidden}
.stack div{height:100%}
.stack div:first-child{border-radius:4px 0 0 4px} .stack div:last-child{border-radius:0 4px 4px 0}

/* ---------- KPI ---------- */
.kpi{cursor:pointer; transition:border-color .15s}
.kpi:hover{border-color:var(--border-2)}
.kpi.sel{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset}
.kpi .ar{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:6px}
.kpi .kv{font-size:22px; font-weight:650; margin:6px 0 2px}
.kpi .tg{display:flex; gap:12px; font-size:11.5px; color:var(--ink-3); margin-top:8px}
.kpi .tg b{color:var(--ink-2); font-weight:600}
.area-h{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:6px 0 8px}
.rag-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.rag{border:1px solid var(--border); border-radius:8px; padding:8px 9px; cursor:pointer; background:var(--surface-2)}
.rag:hover{border-color:var(--border-2)}
.rag .n{font-size:11.5px; color:var(--ink-2); display:flex; align-items:center; gap:5px; line-height:1.25}
.rag .v{font-weight:650; font-size:14px; margin-top:3px}

/* ---------- map ---------- */
.mapsvg{width:100%; height:auto; display:block}
.mapsvg .tile{cursor:pointer}
.mapsvg .tile rect.bg{transition:stroke .1s}
.mapsvg .tile:hover rect.bg, .mapsvg .tile:focus rect.bg{stroke:var(--ink); stroke-width:2}
.mapsvg .tile.sel rect.bg{stroke:var(--brand); stroke-width:3}
.mapsvg .tile.off{cursor:not-allowed; opacity:.28}
.mapsvg .rlab{font-size:11px; letter-spacing:.14em; font-weight:700; fill:var(--ink-3)}
.mapsvg .link{stroke:var(--ink-3); stroke-width:1.2; opacity:.55; fill:none}
.mapsvg .link.over{stroke-dasharray:4 4; stroke:var(--accent-text); opacity:.7}
.mapsvg .gnode rect{fill:var(--surface-3); stroke:var(--accent-text); stroke-width:1.5}
.mapsvg .gnode text{fill:var(--ink); font-size:11px; font-weight:700}
.legend-ramp{display:flex; gap:2px; align-items:center}
.legend-ramp span{display:inline-block; width:26px; height:10px}

/* ---------- diagram ---------- */
.dg .zone{fill:var(--surface-2); stroke:var(--border-2)}
.dg .zone-y{fill:var(--surface-2); stroke:var(--accent-text); stroke-width:1.5}
.dg .box{fill:var(--surface); stroke:var(--border-2)}
.dg .boxy{fill:var(--brand)}
.dg .t1{fill:var(--ink); font-size:13px; font-weight:700}
.dg .t2{fill:var(--ink-2); font-size:11px}
.dg .t3{fill:var(--ink-3); font-size:10px; letter-spacing:.12em; font-weight:700}
.dg .tb{fill:var(--brand-ink); font-size:13px; font-weight:700}
.dg .tb2{fill:var(--brand-ink); font-size:11px}
.dg .ln{stroke:var(--ink-3); stroke-width:1.5; fill:none}
.dg .lny{stroke:var(--accent-text); stroke-width:1.8; fill:none}
.dg .lnd{stroke:var(--ink-3); stroke-width:1.3; fill:none; stroke-dasharray:5 4}

/* ---------- alerts, toasts, tip ---------- */
.drawer{position:fixed; top:0; right:0; bottom:0; width:430px; max-width:100vw; background:var(--surface); border-left:1px solid var(--border-2); z-index:60; display:flex; flex-direction:column; box-shadow:-12px 0 30px rgba(0,0,0,.25)}
.drawer-h{padding:16px 18px 10px; border-bottom:1px solid var(--border)}
.drawer-b{flex:1; overflow-y:auto; padding:12px 14px}
.dback{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:59}
.al{border:1px solid var(--border); border-left-width:3px; border-radius:8px; padding:10px 12px; margin-bottom:10px; background:var(--surface-2)}
.al.crit{border-left-color:var(--crit)} .al.warn{border-left-color:var(--warn)} .al.info{border-left-color:var(--s1)} .al.serious{border-left-color:var(--serious)}
.al .at{font-weight:650; font-size:13.5px; margin:5px 0 3px}
.al .ad{font-size:12.5px; color:var(--ink-2)}
.al .aa{font-size:12.5px; margin-top:5px}
.toasts{position:fixed; right:18px; bottom:18px; z-index:80; display:flex; flex-direction:column; gap:8px; width:340px; max-width:calc(100vw - 36px)}
.toastx{background:var(--surface-3); border:1px solid var(--border-2); border-left:3px solid var(--s1); border-radius:8px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:13px; animation:tin .2s ease}
.toastx.crit{border-left-color:var(--crit)} .toastx.warn{border-left-color:var(--warn)} .toastx.good{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
.tipbox{position:fixed; z-index:100; pointer-events:none; background:var(--surface-3); border:1px solid var(--border-2); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 8px 22px rgba(0,0,0,.28); max-width:300px; color:var(--ink)}
.tipbox .tt{font-weight:650; margin-bottom:4px}
.tipbox .tr2{display:flex; justify-content:space-between; gap:14px}
.tipbox .tr2 b{font-weight:650}
.tipbox .tr2 span{color:var(--ink-3)}

/* ---------- copilot ---------- */
.chat{display:flex; flex-direction:column; height:520px}
@media (min-width:1200px){ .chat{height:700px} }
.chat-log{flex:1; overflow-y:auto; padding:4px 2px 8px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:88%; padding:9px 12px; border-radius:10px; font-size:13.5px; line-height:1.5; white-space:pre-line}
.msg.u{align-self:flex-end; background:var(--brand); color:var(--brand-ink); border-bottom-right-radius:3px}
.msg.b{align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:3px}
.msg.b.blocked{border-color:var(--serious)}
.msg .src{font-size:11px; color:var(--ink-3); margin-top:6px; white-space:normal}
.typing span{display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background:var(--ink-3); animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25} 40%{opacity:1}}
.sugg{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.sugg button{border:1px solid var(--border-2); background:var(--surface-2); color:var(--ink-2); border-radius:999px; font-size:12px; padding:4px 10px; cursor:pointer}
.sugg button:hover{color:var(--ink); border-color:var(--ink-3)}
.chat-in{display:flex; gap:8px; border-top:1px solid var(--border); padding-top:10px}
.chat-in input{flex:1; background:var(--surface-2); border:1px solid var(--border-2); border-radius:8px; color:var(--ink); padding:8px 10px; outline:none; font-size:13.5px}
.guard{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border)}
.guard:last-child{border-bottom:none}
.guard i{color:var(--accent-text); font-size:16px; margin-top:1px}

/* ---------- playbook ---------- */
.phase{position:relative; border-radius:10px; padding:14px 16px; height:100%}
.phase-h{display:flex; align-items:center; gap:10px; margin:-14px -16px 12px; padding:12px 16px; border-radius:10px 10px 0 0; font-weight:700; clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%)}
.ph1{background:#2b2b35; color:#fff} .ph2{background:#4a4a56; color:#fff} .ph3{background:var(--brand); color:var(--brand-ink)}
.phase-h .d{font-size:19px}
.ck{display:flex; gap:9px; padding:7px 0; border-bottom:1px solid var(--border); align-items:flex-start}
.ck:last-child{border-bottom:none}
.ck .ic{font-size:16px; margin-top:0}
.ck .tx{flex:1; font-size:13px}
.ck .ow{font-size:11px; color:var(--ink-3)}

/* ---------- misc ---------- */
.banner{display:flex; gap:12px; align-items:flex-start; background:var(--warn-bg); border:1px solid rgba(250,178,25,.35); border-radius:10px; padding:11px 14px; font-size:13px; margin-bottom:16px}
.banner i{color:var(--warn-t); font-size:18px}
.wave{display:flex; gap:3px; margin-top:8px}
.wave div{flex:1; padding:7px 8px; font-size:11.5px; border-radius:4px; background:var(--surface-3); color:var(--ink-2); position:relative}
.wave div.done{background:rgba(var(--heat),.22); color:var(--ink)}
.wave div.now{background:var(--brand); color:var(--brand-ink); font-weight:650}
.steps{display:flex; gap:8px; flex-wrap:wrap}
.step{flex:1 1 150px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; position:relative}
.step .n{font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--accent-text)}
.step .h{font-weight:650; font-size:13px; margin:2px 0}
.step .d{font-size:12px; color:var(--ink-2)}
.heat td.hc{text-align:right; font-variant-numeric:tabular-nums; border:2px solid var(--surface)}
.chart-wrap{position:relative; width:100%}
.legend-x{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink-2); margin-top:8px}
.comm p{margin:0 0 9px; font-size:13.5px; line-height:1.55}
.comm b{font-weight:650}
.kbd{font-size:11px; border:1px solid var(--border-2); border-radius:4px; padding:0 5px; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

function kpiStatus(v, m12, m24, dir){
  const g=(m12+m24)/2, ok=(a,b)=> dir>0 ? a>=b-1e-9 : a<=b+1e-9;
  if(ok(v,m24)) return { s:'good', t:'Target met' };
  if(ok(v,g))   return { s:'good', t:'On track' };
  if(ok(v,m12)) return { s:'warn', t:'Watch' };
  return { s:'crit', t:'Behind' };
}

function trendFor(k, cur){ // monthly M0..M18 path from baseline to current, deterministic wobble
  const out=[]; for(let m=0;m<=18;m++){ const t=m/18; const s=t*t*(3-2*t); const w=Math.sin(m*1.7+k.id.length)*0.035*Math.abs(cur-k.b0); out.push(k.b0+(cur-k.b0)*s + (m===0||m===18?0:w)); } return out;
}

/* ---------- cut-off status (depends on clock) ---------- */
function cutoffRows(){
  return CUTOFFS.map(c => {
    const left = c.ist - store.clockMin;
    let s, t;
    if(left <= 0){ s = c.pending ? 'warn' : 'neutral'; t = c.pending ? 'Missed · next value date' : 'Closed'; }
    else if(left <= 60 && c.pending){ s='warn'; t='Closing in '+left+' min'; }
    else { s='good'; t='Open · '+(left>=60? Math.floor(left/60)+'h '+p2(left%60)+'m' : left+' min')+' left'; }
    return { ...c, left, s, t, istStr: hhmm(c.ist) + (c.ist>=1440?' (+1)':'') };
  });
}

/* ---------- stress engine (26 weeks) ---------- */
function runStress(o){
  o = Object.assign({ bank:null, fx:0, hedge:true, days:0, share:1, deferDiv:false, deferCapex:false }, o||{});
  const R = RUN.R, d = o.days/7;
  const Rint = (a,b) => { let s=0; for(let j=Math.floor(a); j<Math.ceil(b); j++){ if(j<0) continue; const lo=Math.max(a,j), hi=Math.min(b,j+1); if(hi>lo) s += (j<26?R[j]:R[25])*(hi-lo); } return s; };
  let cash = GROUP_CASH, rcf = RCF_TOTAL, frozen = 0, frozenForeign = 0;
  if(o.bank){ frozen = bankTotal(o.bank); frozenForeign = frozen - bankTotal(o.bank, ENT.filter(e=>e.ccy==='INR')); rcf -= (BANKS.find(b=>b.id===o.bank).rcf||0); }
  cash -= frozen;
  const foreign = (GROUP_CASH - INR_CASH) - frozenForeign;
  const fxPairs = FXEXP.filter(p=>!p.exempt);
  const series=[], liq=[]; let fxHit=0, recLost=0;
  for(let k=0;k<26;k++){
    const rec = (1-o.share)*R[k] + o.share*Rint(k-d, k+1-d);
    recLost += R[k]-rec;
    const b = Math.min(3, Math.floor(k/13));
    const unhedged = sum(fxPairs.map(p => p.net[b]*(o.hedge ? (1-p.ratio[b]/100) : 1)))/13;
    let fxLoss = o.fx/100*unhedged; if(k===0) fxLoss += o.fx/100*foreign;
    fxHit += fxLoss;
    const out = RUN.P[k]+RUN.payroll[k]+RUN.tax[k]+(o.deferDiv?0:RUN.div[k])+RUN.capex[k]*(o.deferCapex?0.5:1)+RUN.debt[k];
    cash += rec - out - fxLoss;
    series.push(Math.round(cash)); liq.push(Math.round(cash + rcf));
  }
  const low = Math.min(...series), lowW = series.indexOf(low)+1;
  const fw = f => { const i=series.findIndex(f); return i<0?null:i+1; };
  const belowMin = fw(v=>v<MIN_CASH), out0 = fw(v=>v<0);
  const lq = liq.findIndex(v=>v<0); const outLiq = lq<0?null:lq+1;
  return { series, liq, low, lowW, belowMin, out0, outLiq, rcf, frozen, fxHit:Math.round(fxHit), recLost:Math.round(recLost) };
}

function detect(s){
  const ents = ENT.filter(e => ENT_ALIASES[e.code].some(a => new RegExp(a).test(s)));
  const regs = [];
  if(/\beurope|european\b/.test(s)) regs.push('Europe');
  if(/\bamericas\b/.test(s)) regs.push('Americas');
  if(/\bmea\b|middle east/.test(s)) regs.push('MEA');
  if(/\basia\b/.test(s)) regs.push('Asia');
  let ccy = (s.match(/\b(inr|usd|eur|gbp|aed|cad|mxn|brl|zar|bdt)\b/)||[])[1];
  ccy = ccy ? ccy.toUpperCase() : (/\beuros?\b/.test(s)?'EUR': /\bsterling|pounds?\b/.test(s)?'GBP': /\brupees?\b/.test(s)?'INR': /\bdollars?\b/.test(s)?'USD': null);
  let bank = null;
  if(/standard chartered|\bscb\b|stanchart/.test(s)) bank='SCB';
  else if(/standard bank|stanbic/.test(s)) bank='SB';
  else if(/hsbc/.test(s)) bank='HSBC';
  else if(/\bciti/.test(s)) bank='Citi';
  else if(/scotia/.test(s)) bank='Scotia';
  else if(/legacy/.test(s)) bank='Legacy';
  return { ents, regs, ccy, bank };
}

function runwayConfig(P, compact){
  const labels = ['W−4','W−3','W−2','W−1','Today', ...Array.from({length:13},(_,i)=>'W'+(i+1))];
  const pad = Array(4).fill(null), fc = RUN.fc.slice(0,13), n13 = Array(13).fill(null);
  const upper = [...pad, GROUP_CASH, ...fc.map((v,i)=>Math.round(v*(1+bandPct(i+1))))];
  const lower = [...pad, GROUP_CASH, ...fc.map((v,i)=>Math.round(v*(1-bandPct(i+1))))];
  const lowIdx = 4 + LOW.w;
  return markRaw({ type:'line', data:{ labels, datasets:[
    { label:'90% band', data:upper, borderWidth:0, pointRadius:0, pointHitRadius:0, fill:'+1', backgroundColor:P.band, order:9 },
    { label:'_lower', data:lower, borderWidth:0, pointRadius:0, pointHitRadius:0, fill:false, order:9 },
    { label:'Actual', data:[...ACT, ...n13], borderColor:P.s1, backgroundColor:P.s1, borderWidth:2, pointRadius:3, pointHoverRadius:5, tension:.25, order:1 },
    { label:'Forecast', data:[...pad, GROUP_CASH, ...fc], borderColor:P.s4, backgroundColor:P.s4, borderWidth:2, pointRadius:c=>c.dataIndex===lowIdx?6:2, pointBorderColor:P.surface, pointBorderWidth:c=>c.dataIndex===lowIdx?2:0, tension:.25, order:2 },
    ...(compact?[]:[{ label:'Forecast made 1 week earlier', data:[...PRIOR, null, ...n13], showLine:false, pointRadius:4, pointHoverRadius:5, borderColor:P.s4, backgroundColor:P.surface, borderWidth:2, order:3 }]),
    { label:'Minimum cash ₹'+MIN_CASH+' cr', data:Array(18).fill(MIN_CASH), borderColor:P.crit, backgroundColor:P.crit, borderWidth:1.5, pointRadius:0, pointHitRadius:0, order:4 },
  ]}, options:{ responsive:true, maintainAspectRatio:false, animation:{duration:250}, interaction:{mode:'index', intersect:false},
    plugins:{ legend:legendOpts(P), crosshair:{on:true, color:P.axis},
      pointLabels:{ color:P.ink, items:[{ ds:3, i:lowIdx, text:'W'+LOW.w+' low ₹'+nf(LOW.v)+' cr', align:'right', dx:-10, dy:4 }] },
      tooltip: tipOpts(P, { filter:it=>!String(it.dataset.label).startsWith('_') && it.raw!=null,
        callbacks:{ label:it=>{ if(it.dataset.label==='90% band'){ const lo=it.chart.data.datasets[1].data[it.dataIndex]; return ' 90% band: ₹'+nf(lo)+'–'+nf(it.raw)+' cr'; } return ' '+it.dataset.label.replace(/ ₹.*$/,'')+': ₹'+nf(it.raw)+' cr'; },
          footer:items=>{ const i=items[0].dataIndex-4; return RUN.events[i] ? RUN.events[i] : (i<0&&i>-5? 'Actual vs forecast: '+((ACT[items[0].dataIndex]-PRIOR[items[0].dataIndex])/PRIOR[items[0].dataIndex]*100).toFixed(1)+'%' : ''); } } }) },
    scales: Object.assign(scalesXY(P, { min:600, max:1700, ticks:{ color:P.ink3, callback:v=>'₹'+nf(v) } }), { x:{ grid:{display:false}, border:{color:P.axis}, ticks:{ color:P.ink3, maxRotation:0, autoSkip:true, autoSkipPadding:6 } } }) } });
}

const Spark = { props:['data','color','w','h'], template:`<svg :width="W" :height="H" :viewBox="'0 0 '+W+' '+H" aria-hidden="true"><polyline :points="pts" fill="none" :stroke="color" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle :cx="last[0]" :cy="last[1]" r="2.6" :fill="color"/></svg>`,
  computed:{ W(){return this.w||96}, H(){return this.h||28}, xy(){ const d=this.data, mn=Math.min(...d), mx=Math.max(...d), r=(mx-mn)||1; return d.map((v,i)=>[3+i*(this.W-6)/(d.length-1), this.H-3-(v-mn)/r*(this.H-6)]); }, pts(){ return this.xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '); }, last(){ return this.xy[this.xy.length-1]; } } };

  total(){ return sum(this.ents.map(this.val)); },
  tiles(){ const P=this.P; const bins=[40,60,90,130,250]; return ENT.map(e=>{ const v=this.val(e); const b=bins.filter(x=>v>=x).length; return { e, v, x:-60+e.pos[0]*80, y:40+e.pos[1]*80, fill:P.seq[b], ink: P.seqDarkInk.includes(b)?'#16161d':'#ffffff', off:!this.role.regions.includes(e.region) }; }); },
  linkPaths(){ const c=e=>[-60+e.pos[0]*80+35, 40+e.pos[1]*80+35]; const out=[]; const vis=e=>this.role.regions.includes(e.region);
    ENT.forEach(e=>{ if(!e.pooled||e.hub||!vis(e)) return; const h=ENT.find(x=>x.code===HUB_OF[e.region]); const a=c(e), b=c(h); out.push({ id:e.code, d:'M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1] }); });

  selTotal(){ return sum(this.selBanks.map(b=>b.v)); },
  byBank(){ const es=this.ents; const intra=this.mode==='intra'; const rows=BANKS.map(b=>({ id:b.id, name:b.name, c:'var(--'+b.col+')', feed:b.feed, v: sum(es.map(e=>{ const x=e.banks[b.id]||0; return intra&&b.id!=='Legacy'? x*(1+e.intra/100) : x; })) })).filter(r=>r.v>0);
    const inv=sum(es.map(e=>e.invest||0)); if(inv) rows.push({ id:'Invest', name:'AAA funds and T-bills', c:'var(--s6)', feed:'Custodian, daily', v:inv });
    return rows.map(r=>({...r, v:Math.round(r.v*10)/10})).sort((a,b)=>b.v-a.v); },
  byCcy(){ const m={}; this.ents.forEach(e=>{ m[e.ccy]=m[e.ccy]||{ ccy:e.ccy, v:0, ents:[] }; m[e.ccy].v+=this.val(e); m[e.ccy].ents.push(e.code); }); return Object.values(m).map(x=>({...x, v:Math.round(x.v*10)/10, ents:x.ents.join(', ')})).sort((a,b)=>b.v-a.v); },
},
methods:{ hover(ev,t){ if(t.off){ this.tip(ev, t.e.name, [['Outside your role scope','']]); return; } const e=t.e; this.tip(ev, e.name, [[cr(t.v,0), this.mode==='eod'?'end of day':'intraday'],[localStr(t.v,e.ccy),'local'],[cr(idleOf(e)),'idle above buffer'],[e.pool,'']]); } } };

  totNet(){ return sum(this.pairs.map(p=>sum(p.net))); },
  totNetH(){ return sum(this.hedgeable.map(p=>sum(p.net))); },
  totGross(){ return sum(this.pairs.map(p=>sum(p.gross))); },
  totHedged(){ return Math.round(sum(this.hedgeable.map(pairHedged))); },
  regsIn(){ return this.role.regions.filter(r=>FXEXP.filter(p=>p.region===r).every(pairOk)).length; },
  outCells(){ return sum(this.pairs.map(p=>p.cells.filter(c=>c==='under'||c==='over').length)); },
  actionText(){ const p=this.selP; return p.cells.map((c,i)=> c==='under' ? BUCKETS[i]+' +'+(BAND[i][0]-p.ratio[i])+' pts (≈ '+cr(p.net[i]*(BAND[i][0]-p.ratio[i])/100)+')' : c==='over' ? BUCKETS[i]+' −'+(p.ratio[i]-BAND[i][1])+' pts' : null).filter(Boolean).join('; '); },

    ]}, options:{ responsive:true, maintainAspectRatio:false, animation:{duration:250},
      plugins:{ legend:legendOpts(P), tooltip:tipOpts(P,{ callbacks:{ label:it=> it.dataset.type==='line' ? ' Hedged: '+it.raw+'% ('+(p.cells[it.dataIndex]==='in'?'in band':p.cells[it.dataIndex]+' band')+')' : ' Band: '+it.raw[0]+'–'+it.raw[1]+'%' } }) },
      scales: scalesXY(P, { min:0, max:100, ticks:{ color:P.ink3, callback:v=>v+'%' } }) } }); },
  stackCfg(){ const P=this.P, ps=this.hedgeable; return markRaw({ type:'bar', data:{ labels:ps.map(p=>p.pair), datasets:[
      { label:'Hedged', data:ps.map(p=>Math.round(pairHedged(p))), backgroundColor:P.s1, borderRadius:{topLeft:0,bottomLeft:0,topRight:0,bottomRight:0}, barPercentage:.7 },
      { label:'Open', data:ps.map(p=>Math.round(sum(p.net)-pairHedged(p))), backgroundColor:P.s2, borderRadius:{topRight:4,bottomRight:4}, barPercentage:.7 },
    ]}, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:250}, interaction:{mode:'index', intersect:false}, datasets:{ bar:{ borderColor:P.surface, borderWidth:{right:2} } },
      plugins:{ legend:legendOpts(P), tooltip:tipOpts(P,{ callbacks:{ label:it=>' '+it.dataset.label+': ₹'+nf(it.raw)+' cr' } }) },
      scales:{ x:{ stacked:true, grid:{color:P.grid}, ticks:{color:P.ink3, callback:v=>'₹'+nf(v)}, border:{display:false} }, y:{ stacked:true, grid:{display:false}, ticks:{color:P.ink2}, border:{color:P.axis} } } } }); },
  netRows(){ const g=this.totGross, n=this.totNet, h=this.totHedged; return [ { k:'Gross intercompany and third-party exposure', v:g, c:'var(--neutral)' }, { k:'Net exposure after monthly netting', v:n, c:'var(--s1)' }, { k:'Hedged with forwards', v:h, c:'var(--s3)' } ]; },
},

data(){ return { q:'', thinking:false } },
computed:{

methods:{
  scroll(){ nextTick(()=>{ const el=this.$refs.log; if(el) el.scrollTop=el.scrollHeight; }); },
  ask(q){ q=(q||'').trim(); if(!q || this.thinking) return; store.chat.push({ who:'u', text:q }); this.q=''; this.thinking=true; this.scroll();
    setTimeout(()=>{ const a=copilotAnswer(q); store.chat.push({ who:'b', text:a.text, src:a.src, blocked:a.blocked }); logAudit(a.blocked?'Copilot declined question (out of scope)':'Copilot answered question (read-only)', '"'+q+'"', roleObj.value.label+' → Copilot'); this.thinking=false; this.scroll(); }, 650); },

  approve(){ store.commentaryState='approved'; store.commentaryApprovedAt=nowStr(); logAudit('Approved and published daily liquidity commentary','Drafted by Treasury Copilot'); toast('good','Commentary published','Approved by '+roleObj.value.label+'.'); },

 <view-head title="Liquidity stress test" sub="How long GCPL's cash lasts if a panel bank fails, FX moves 10% or customers pay 30 days late, over 26 weeks" q="Risks"/>
 <div class="filters"><label>Presets</label>
  <button class="btnx sm" @click="preset('bank')">Panel bank fails</button><button class="btnx sm" @click="preset('fx')">10% FX shock</button><button class="btnx sm" @click="preset('delay')">Receipts +30 days</button><button class="btnx sm brand" @click="preset('all')">All three</button><button class="btnx sm" @click="preset('none')">Clear</button></div>
 <div class="row g-3 mb-3">
  <div class="col-md-4"><div class="cardx">
   <label class="sw fw6 mb-2"><input type="checkbox" v-model="bankOn"><span class="tr"></span>Panel bank fails</label>
   <div class="small2 ink2 mb-2">Deposits frozen for the horizon; that bank's share of the committed lines is lost.</div>
   <select class="sel w-100" v-model="bank" :disabled="!bankOn"><option v-for="b in banks" :key="b.id" :value="b.id">{{b.name}} · {{cr(b.amount)}} deposits</option></select>
  </div></div>
  <div class="col-md-4"><div class="cardx">
   <label class="sw fw6 mb-2"><input type="checkbox" v-model="fxOn"><span class="tr"></span>FX shock</label>
   <div class="small2 ink2 mb-1">Adverse move of <b>{{fx}}%</b> on overseas cash and on unhedged flows.</div>
   <div class="d-flex align-items-center gap-2"><span class="small2 muted" style="width:86px">Size</span><input type="range" min="5" max="20" step="1" v-model.number="fx" :disabled="!fxOn" aria-label="FX shock size"></div>
   <label class="sw small2 mt-1"><input type="checkbox" v-model="hedge" :disabled="!fxOn"><span class="tr"></span>Apply the hedge book</label>
  </div></div>
  <div class="col-md-4"><div class="cardx">
   <label class="sw fw6 mb-2"><input type="checkbox" v-model="delayOn"><span class="tr"></span>Customer receipts slip</label>
   <div class="small2 ink2 mb-1">Customers pay <b>{{days}} days</b> late on <b>{{share}}%</b> of receipts.</div>
   <div class="d-flex align-items-center gap-2"><span class="small2 muted" style="width:86px">Days late</span><input type="range" min="15" max="60" step="5" v-model.number="days" :disabled="!delayOn" aria-label="Days of delay"></div>
   <div class="d-flex align-items-center gap-2"><span class="small2 muted" style="width:86px">Share</span><input type="range" min="25" max="100" step="5" v-model.number="share" :disabled="!delayOn" aria-label="Share of receipts delayed"></div>
  </div></div>
 </div>
 <div class="row g-3 mb-3">
  <div class="col-6 col-xl-3"><div class="cardx stat dark-card"><div class="lbl" style="color:#a9a8a0">Cash lasts</div><div class="val" style="color:#ffe600">{{lastsTxt}}</div><div class="sub" style="color:#c3c2b7">{{S.out0 ? 'before cash hits zero (no lines drawn)' : 'cash stays positive across the horizon'}}</div></div></div>
  <div class="col-6 col-xl-3"><div class="cardx stat"><div class="lbl">Below ₹{{MIN}} cr minimum from</div><div class="val">{{S.belowMin?'Week '+S.belowMin:'Never'}}</div><div class="sub"><s-chip :s="S.belowMin? (S.belowMin<=4?'crit':'warn') : 'good'" :text="S.belowMin?'Breach':'Within policy'"/></div></div></div>
  <div class="col-6 col-xl-3"><div class="cardx stat"><div class="lbl">With undrawn lines (₹{{S.rcf}} cr)</div><div class="val">{{S.outLiq?'Week '+S.outLiq:'26+ weeks'}}</div><div class="sub">{{S.outLiq?'liquidity runs out':'lines cover the gap'}}</div></div></div>
  <div class="col-6 col-xl-3"><div class="cardx stat"><div class="lbl">Lowest cash</div><div class="val">{{cr(S.low)}}</div><div class="sub">week {{S.lowW}} · base case {{cr(B.low)}}</div></div></div>
 </div>
 <div class="row g-3 mb-3">
  <div class="col-xl-8"><div class="cardx">
   <div class="ch"><div><div class="ct">Cash over 26 weeks: base vs stressed (INR cr)</div><div class="cs">{{activeText}}</div></div>
    <div class="d-flex gap-3 flex-wrap"><label class="sw small2"><input type="checkbox" v-model="deferDiv"><span class="tr"></span>Defer interim dividend</label><label class="sw small2"><input type="checkbox" v-model="deferCapex"><span class="tr"></span>Defer 50% of capex</label></div></div>
   <v-chart :config="cfg" :height="320" label="Base and stressed cash"/>
  </div></div>
  <div class="col-xl-4"><div class="cardx">
   <div class="ct mb-2">If it happens: the playbook</div>
   <div class="guard"><i class="bi bi-1-circle"></i><div class="small2"><b>Draw the committed lines</b> · ₹{{S.rcf}} cr available{{bankOn && bankRcf ? ' (₹'+bankRcf+' cr lost with '+bankName(bank)+')' : ''}}</div></div>
   <div class="guard"><i class="bi bi-2-circle"></i><div class="small2"><b>Defer the interim dividend</b> · ₹364 cr in week 9</div></div>
   <div class="guard"><i class="bi bi-3-circle"></i><div class="small2"><b>Pull surplus through the GRCTC in-house bank</b> from the Europe and Americas headers</div></div>
   <div class="guard"><i class="bi bi-4-circle"></i><div class="small2"><b>Redeem AAA funds</b> · ₹180 cr, same or next day</div></div>
   <div class="guard"><i class="bi bi-5-circle"></i><div class="small2"><b>Defer discretionary capex</b> · ≈ ₹6 cr a week</div></div>
   <div class="small2 muted mt-2">Why the 35% / 15% deposit caps matter: a failure at the largest bank freezes {{cr(cpHSBC)}}, not the majority of group cash.</div>
  </div></div>
 </div>
 <div class="cardx">
  <div class="ch"><div><div class="ct">Scenario comparison</div><div class="cs">Each stress alone and combined, with the mitigation toggles above · table view of the chart</div></div></div>
  <div class="tscroll"><table class="tbl"><thead><tr><th>Scenario</th><th class="r">Lowest cash</th><th>Below minimum from</th><th>Cash runs out</th><th>With undrawn lines</th><th class="r">Impact</th></tr></thead><tbody>
   <tr v-for="r in table" :key="r.k"><td class="fw6">{{r.k}}</td><td class="r">{{cr(r.r.low)}} <span class="small2 muted">W{{r.r.lowW}}</span></td><td><s-chip :s="r.r.belowMin?'warn':'good'" :text="r.r.belowMin?'Week '+r.r.belowMin:'Never'"/></td><td><s-chip :s="r.r.out0?'crit':'good'" :text="r.r.out0?'Week '+r.r.out0:'Lasts 26+ weeks'"/></td><td><s-chip :s="r.r.outLiq?'crit':'good'" :text="r.r.outLiq?'Week '+r.r.outLiq:'26+ weeks'"/></td><td class="r small2">{{r.impact}}</td></tr>
  </tbody></table></div>
  <div class="small2 muted mt-2">Simplified model on the illustrative 26-week flows: receipts, payments, payroll, advance tax (weeks 9 and 21), interim dividend (week 9), capex and debt service. FX shock hits overseas cash once and unhedged flows weekly.</div>
 </div>
</div>`,
computed:{
  MIN:()=>MIN_CASH, cpHSBC:()=>cpOf('HSBC').amount,
  banks(){ return BANKS.filter(b=>!b.runoff).map(b=>({ ...b, amount:bankTotal(b.id) })); },
  bankRcf(){ return (BANKS.find(b=>b.id===this.bank)||{}).rcf||0; },
  opts(){ return { bank:this.bankOn?this.bank:null, fx:this.fxOn?this.fx:0, hedge:this.hedge, days:this.delayOn?this.days:0, share:this.share/100, deferDiv:this.deferDiv, deferCapex:this.deferCapex }; },
  S(){ return runStress(this.opts); },
  B(){ return runStress({}); },
  lastsTxt(){ return this.S.out0 ? (this.S.out0-1)+' weeks' : '26+ weeks'; },
  activeText(){ const a=[]; if(this.bankOn) a.push(bankName(this.bank)+' fails'); if(this.fxOn) a.push(this.fx+'% FX shock'+(this.hedge?'':' (no hedges)')); if(this.delayOn) a.push('receipts +'+this.days+' days on '+this.share+'%'); if(this.deferDiv) a.push('dividend deferred'); if(this.deferCapex) a.push('capex halved'); return a.length ? 'Stressed: '+a.join(' · ') : 'No stress selected: stressed line equals the base case'; },
  table(){ const m={ deferDiv:this.deferDiv, deferCapex:this.deferCapex }; const b=this.bank;
    const rows=[ ['Base case', {}, '—'], [bankName(b)+' fails', { bank:b }, cr(bankTotal(b))+' frozen'], [this.fx+'% FX shock', { fx:this.fx, hedge:this.hedge }, null], ['Receipts +'+this.days+' days ('+this.share+'%)', { days:this.days, share:this.share/100 }, null], ['All three', { bank:b, fx:this.fx, hedge:this.hedge, days:this.days, share:this.share/100 }, null] ];
    return rows.map(([k,o,imp])=>{ const r=runStress({ ...o, ...m }); return { k, r, impact: imp || (o.fx&&!o.days&&!o.bank ? cr(r.fxHit)+' FX hit' : o.days&&!o.bank ? cr(r.recLost)+' receipts delayed' : o.bank ? cr(bankTotal(b))+' frozen, '+cr(r.fxHit)+' FX, '+cr(r.recLost)+' late' : '—') }; }); },
  cfg(){ const P=this.P, S=this.S, B=this.B; const labels=['Now', ...Array.from({length:26},(_,i)=>'W'+(i+1))];
    const start = GROUP_CASH - (S.frozen||0);
    return markRaw({ type:'line', data:{ labels, datasets:[
      { label:'Base case', data:[GROUP_CASH, ...B.series], borderColor:P.s1, backgroundColor:P.s1, borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:.2 },
      { label:'Stressed', data:[start, ...S.series], borderColor:P.s2, backgroundColor:P.s2, borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:.2 },
      { label:'Stressed + undrawn lines', data:[start+S.rcf, ...S.liq], borderColor:P.s2, backgroundColor:P.s2, borderDash:[6,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:3, tension:.2 },
      { label:'Minimum cash', data:Array(27).fill(MIN_CASH), borderColor:P.crit, backgroundColor:P.crit, borderWidth:1.5, pointRadius:0, pointHitRadius:0 },
      { label:'_zero', data:Array(27).fill(0), borderColor:P.axis, borderWidth:1, pointRadius:0, pointHitRadius:0 },
    ]}, options:{ responsive:true, maintainAspectRatio:false, animation:{duration:200}, interaction:{mode:'index', intersect:false},
      plugins:{ legend:legendOpts(P), crosshair:{on:true, color:P.axis}, tooltip:tipOpts(P,{ filter:it=>!it.dataset.label.startsWith('_'), callbacks:{ label:it=>' '+it.dataset.label+': ₹'+nf(it.raw)+' cr', footer:items=>{ const i=items[0].dataIndex; return RUN.events[i] || (i===21?'Advance tax ₹190 cr':''); } } }) },
      scales: Object.assign(scalesXY(P, { suggestedMin:-200, suggestedMax:2100, ticks:{ color:P.ink3, callback:v=>(v<0?'−₹':'₹')+nf(Math.abs(v)) } }), { x:{ grid:{display:false}, border:{color:P.axis}, ticks:{ color:P.ink3, maxRotation:0, autoSkip:true, autoSkipPadding:8 } } }) } }); },
},
methods:{ preset(k){ this.bankOn = k==='bank'||k==='all'; this.fxOn = k==='fx'||k==='all'; this.delayOn = k==='delay'||k==='all'; if(k==='bank'||k==='all') this.bank='HSBC'; if(k==='fx'||k==='all'){ this.fx=10; this.hedge=true; } if(k==='delay'||k==='all'){ this.days=30; this.share=100; } } } };

/* ---------------- ALERTS DRAWER ---------------- */
const AlertsDrawer = { mixins:[shared], components:{ SChip }, emits:['close'],
data(){ return { tab:'open' } },
template:`<div>
 <div class="dback" @click="$emit('close')"></div>
 <aside class="drawer" role="dialog" aria-label="Alerts">
  <div class="drawer-h">
   <div class="d-flex justify-content-between align-items-center"><div class="fw7" style="font-size:16px"><i class="bi bi-bell"></i> Alerts</div><button class="btn-icon" @click="$emit('close')" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
   <div class="small2 muted mt-1">Automatic rules run on every data refresh · scoped to {{role.label}}</div>
   <div class="seg mt-2"><button :class="{on:tab==='open'}" @click="tab='open'">Open ({{open.length}})</button><button :class="{on:tab==='ack'}" @click="tab='ack'">Acknowledged ({{acked.length}})</button><button :class="{on:tab==='rules'}" @click="tab='rules'">Rules</button></div>
  </div>
  <div class="drawer-b">
   <template v-if="tab!=='rules'">
    <div v-if="!list.length" class="small2 muted p-3">Nothing here.</div>
    <div v-for="a in list" :key="a.id" class="al" :class="a.sev">
     <div class="d-flex justify-content-between gap-2"><s-chip :s="a.sev" :text="a.cat"/><span class="small2 muted">{{a.time}}{{a.sim?' · live':''}}</span></div>
     <div class="at">{{a.title}}</div><div class="ad">{{a.detail}}</div>
     <div class="aa"><b>Action:</b> {{a.action}}</div>
     <div class="d-flex justify-content-between align-items-center mt-2"><span class="small2 muted">Owner: {{a.owner}}</span>
      <span><button class="btnx sm me-1" @click="go(a.view); $emit('close')">View</button><button class="btnx sm" v-if="!store.ack[a.id]" @click="ack(a)">Acknowledge</button><span v-else class="small2 muted">Ack {{store.ack[a.id]}}</span></span></div>
    </div>
   </template>
   <template v-else>
    <div class="cardx mb-3" style="height:auto">
     <div class="fw6 mb-2">Thresholds</div>
     <div class="d-flex justify-content-between align-items-center mb-2"><span class="small2">Idle cash above buffer (INR cr)</span><input class="num" type="number" min="0" max="100" v-model.number="store.th.idle"></div>
     <div class="d-flex justify-content-between align-items-center mb-2"><span class="small2">Forecast miss (%)</span><input class="num" type="number" min="1" max="50" v-model.number="store.th.miss"></div>
     <div class="d-flex justify-content-between align-items-center"><span class="small2">Warn at % of counterparty cap</span><input class="num" type="number" min="50" max="100" v-model.number="store.th.limitWarn"></div>
     <div class="small2 muted mt-2">Limit breaches always raise a critical alert and reach the Group Treasurer within 24 hours.</div>
    </div>
    <div class="cardx" style="height:auto">
     <div class="fw6 mb-1">Demo: live event</div>
     <div class="small2 ink2 mb-2">Pushes the next intraday event through the rules (limit move, receipts miss, sanctions hold).</div>
     <button class="btnx brand" @click="sim">Simulate intraday event</button>
    </div>
   </template>
  </div>
 </aside>
</div>`,
computed:{ open(){ return OPEN_ALERTS.value; }, acked(){ return VISIBLE_ALERTS.value.filter(a=>store.ack[a.id]); }, list(){ const o={crit:0,warn:1,info:2}; return (this.tab==='open'?this.open:this.acked).slice().sort((a,b)=>o[a.sev]-o[b.sev]); } },
methods:{ ack(a){ store.ack[a.id]=nowStr(); logAudit('Acknowledged alert', a.title); }, sim(){ simulateEvent(); this.tab='open'; } } };

/* =====================================================================
   ROOT
   ===================================================================== */
const app = createApp({
  components:{ OverviewView, CashMapView, RunwayView, CounterpartyView, FxView, PaymentsView, KpiView, GiftView, FeesView, CopilotView, PlaybookView, StressView, AlertsDrawer },
  data(){ return { navOpen:false, alertsOpen:false, quickQ:'' } },
  template:`
  <div class="topband"></div>
  <div class="shell">
   <div class="nav-backdrop d-lg-none" v-if="navOpen" @click="navOpen=false"></div>
   <aside class="side" :class="{open:navOpen}" aria-label="Main navigation">
    <div class="brand"><div class="logo">GCPL</div><div><div class="b1">Treasury Control Tower</div><div class="b2">Simulated data · programme month 18</div></div></div>
    <div class="nav-sec">Control Tower</div>
    <button v-for="v in views.filter(x=>x.grp==='ct')" :key="v.id" class="nav-it" :class="{active:store.view===v.id, locked:!allowed(v.id)}" @click="pick(v.id)" :title="allowed(v.id)?v.label:'Not in your role scope'"><i class="bi" :class="allowed(v.id)?v.icon:'bi-lock'"></i>{{v.label}}<span class="q">{{v.q}}</span></button>
    <div class="nav-sec">Innovations</div>
    <button v-for="v in views.filter(x=>x.grp==='in')" :key="v.id" class="nav-it" :class="{active:store.view===v.id, locked:!allowed(v.id)}" @click="pick(v.id)" :title="allowed(v.id)?v.label:'Not in your role scope'"><i class="bi" :class="allowed(v.id)?v.icon:'bi-lock'"></i>{{v.label}}<span class="q">{{v.q}}</span></button>
    <div class="side-foot">Global Treasury Centre, Mumbai · GRCTC, GIFT City · 3 regional desks · TSSC payment factory<br><br>5 panel banks · cloud TMS · one SWIFT channel on ISO 20022</div>
   </aside>
   <div class="main">
    <header class="topbar">
     <button class="btn-icon d-lg-none" @click="navOpen=true" aria-label="Open navigation"><i class="bi bi-list"></i></button>
     <div class="role-pick"><label for="rolesel">Viewing as</label><select id="rolesel" :value="store.role" @change="setRole($event.target.value)"><option v-for="r in roles" :key="r.id" :value="r.id">{{r.label}}</option></select></div>
     <form class="ask d-none d-md-flex" @submit.prevent="askQuick"><i class="bi bi-stars"></i><input v-model="quickQ" placeholder="Ask Treasury Copilot, e.g. EUR exposure to HSBC" aria-label="Ask Treasury Copilot"></form>
     <div class="fresh d-none d-xl-flex"><span>End of day <b>camt.053 · 06:10</b></span><span>Intraday <b>camt.052 / API · {{intraAt}}</b></span></div>
     <div class="clock ms-auto ms-xl-0" title="Demo clock (IST)"><span class="live-dot"></span>{{clock}} IST</div>
     <button class="btn-icon" @click="toggleTheme" :aria-label="'Switch to '+(store.theme==='dark'?'light':'dark')+' theme'"><i class="bi" :class="store.theme==='dark'?'bi-sun':'bi-moon-stars'"></i></button>
     <button class="btn-icon" @click="alertsOpen=true" aria-label="Open alerts"><i class="bi bi-bell"></i><span class="badge-n" v-if="openN">{{openN}}</span></button>
    </header>
    <main class="content">
     <component :is="comp" :key="store.view+'|'+store.role"></component>
    </main>
    <footer class="foot">Simulated data for the EY CAFTA Case Championship 2026 case (Global Consumer Products Ltd). Not real company data. INR crore unless stated; FX at indicative rates. Design ideas: Treasury Control Tower, GIFT City GRCTC, camt.086 fee audit, Treasury Copilot, Treasury-in-a-box, liquidity stress test.</footer>
   </div>
  </div>
  <alerts-drawer v-if="alertsOpen" @close="alertsOpen=false"></alerts-drawer>
  <div class="toasts" aria-live="polite"><div v-for="t in store.toasts" :key="t.id" class="toastx" :class="t.sev"><div class="fw6">{{t.title}}</div><div class="small2 ink2">{{t.body}}</div></div></div>
  <div class="tipbox" v-if="store.tip" :style="tipStyle"><div class="tt">{{store.tip.title}}</div><div class="tr2" v-for="(r,i) in store.tip.rows" :key="i"><b>{{r[0]}}</b><span>{{r[1]}}</span></div></div>
  `,
  computed:{
    store:()=>store, roles:()=>ROLES, views:()=>VIEWS,
    comp(){ return { overview:'OverviewView', cashmap:'CashMapView', runway:'RunwayView', counterparty:'CounterpartyView', fx:'FxView', payments:'PaymentsView', kpi:'KpiView', gift:'GiftView', fees:'FeesView', copilot:'CopilotView', playbook:'PlaybookView', stress:'StressView' }[store.view]; },
    clock(){ return hhmm(store.clockMin)+':'+p2(store.clockSec); },
    intraAt(){ return hhmm(Math.floor(store.clockMin/15)*15); },
    openN(){ return OPEN_ALERTS.value.length; },
    tipStyle(){ const t=store.tip; const w=window.innerWidth, h=window.innerHeight; const left = Math.min(t.x+14, w-310), top = t.y+16 > h-120 ? t.y-110 : t.y+16; return { left:left+'px', top:top+'px' }; },
  },
  methods:{
    allowed(v){ return roleObj.value.views.includes(v); },
    pick(v){ navigate(v); this.navOpen=false; },
    setRole(id){ store.role=id; const r=roleObj.value; if(!r.views.includes(store.view)) store.view=r.home; toast('info','Viewing as '+r.label, (r.regions.length===4?'All 15 entities':'Scoped to '+r.regions.join(', ')+': '+scopeEnts.value.length+' entities')+' · '+r.views.length+' views.'); logAudit('Switched role view', r.label, r.label); },
    toggleTheme(){ store.theme = store.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=store.theme; document.documentElement.setAttribute('data-bs-theme', store.theme); try{ localStorage.setItem('gcpl-ct-theme', store.theme); }catch(e){} },
    askQuick(){ const q=this.quickQ.trim(); if(!q) return; this.quickQ=''; store.copilotPending=q; if(store.view!=='copilot') navigate('copilot'); },
  },
  mounted(){
    setInterval(()=>{ store.clockSec++; if(store.clockSec>=60){ store.clockSec=0; store.clockMin++; } }, 1000);
    window.addEventListener('scroll', ()=>{ store.tip=null; }, { passive:true });
    window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ this.alertsOpen=false; this.navOpen=false; } });
  },
});
app.mount('#app');
</script>
</body>
</html>
